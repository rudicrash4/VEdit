name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # diperlukan hanya untuk membuat GitHub Release berisi APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # ---- Rust engine: toolchain, cargo-ndk, lalu cek format/lint/tes sebelum Gradle ----
      - name: Set up Rust (stable + target Android)
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          rustc --version && cargo --version
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/vedit-core
            rust/vedit-bridge

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust fmt, clippy, unit tests
        run: |
          set -e
          for d in rust/vedit-core rust/vedit-bridge; do
            echo "=== $d"
            (cd "$d" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test)
          done

      # Keystore didekode dari Secret ke file sementara di runner. Isinya tidak dicetak;
      # GitHub juga menyamarkan nilai secret di log. Tanpa secret (mis. PR dari fork), build
      # memakai debug key bawaan dan hal itu diberi peringatan di langkah verifikasi.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/vedit-release.jks"
            echo "VEDIT_KEYSTORE_PATH=$RUNNER_TEMP/vedit-release.jks" >> "$GITHUB_ENV"
            echo "Signing key tersedia (permanen)."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tidak tersedia. APK memakai debug key sementara dan tidak bisa menjadi update dari APK bertanda tangan permanen."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pvedit.requireNative=true --stacktrace

      - name: Lint
        run: ./gradlew lintDebug -Pvedit.requireNative=true --stacktrace

      - name: Assemble debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug -Pvedit.requireNative=true --stacktrace

      - name: Name APK, verify, and write summary
        id: apk
        run: |
          VERSION=$(grep '^vedit.versionName=' gradle.properties | cut -d= -f2)
          STAGE=$(grep '^vedit.stage=' gradle.properties | cut -d= -f2)
          NAME="VEdit-${STAGE}-v${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          FP=$("$BT/apksigner" verify --print-certs "dist/${NAME}" | grep -m1 "certificate SHA-256 digest" | sed 's/.*: //')
          BADGING=$("$BT/aapt2" dump badging "dist/${NAME}")
          echo "$BADGING" | grep -E "^package:|application-label:|application-icon" | head -8
          LIBS=$(unzip -l "dist/${NAME}" | grep -o "lib/[a-z0-9-]*/libvedit_bridge.so" | sort | tr '\n' ' ')
          echo "Native libs di APK: ${LIBS}"
          echo "$LIBS" | grep -q "lib/arm64-v8a/libvedit_bridge.so" || { echo "::error::APK tidak memuat libvedit_bridge.so untuk arm64-v8a"; exit 1; }
          echo "$BADGING" | grep -q "application-icon" || { echo "::error::APK tidak memiliki ikon launcher"; exit 1; }
          if [ -n "$VEDIT_KEYSTORE_PATH" ]; then MODE="permanen (secrets)"; else MODE="debug key sementara (TIDAK kompatibel untuk update antar-build)"; fi
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "stage=${STAGE}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${NAME}"
            echo "- Commit: \`${GITHUB_SHA::7}\`, build/versionCode: ${GITHUB_RUN_NUMBER}"
            echo "- Signing: ${MODE}"
            echo "- Sidik jari sertifikat SHA-256 (publik): \`${FP}\`"
            echo "- Native: ${LIBS}"
            echo "- Verifikasi: apksigner OK, aapt2 badging OK, ikon launcher ada. Ini BUKAN uji instal di perangkat."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/vedit-release.jks"

      # APK langsung juga dipublikasikan lewat GitHub Release pada push ke main.
      - name: Publish APK as GitHub Release asset
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          STAGE: ${{ steps.apk.outputs.stage }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="VEdit ${STAGE} v${VERSION}. Milestone migrasi Hybrid Rust Engine: core editing (model proyek, operasi timeline, undo/redo, kanvas, perencana) kini di Rust dan menjadi jalur utama lewat bridge JNI; engine Kotlin lama tetap sebagai cadangan otomatis. Media3 dipertahankan untuk preview dan export. Lolos CI (tes Rust, tes Kotlin termasuk differential Rust vs Kotlin, lint, assembleDebug). BELUM diuji di perangkat fisik. APK debug untuk pengujian; debug key sementara. Commit ${GITHUB_SHA::7}, build ${GITHUB_RUN_NUMBER}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${NAME}" --clobber
          else
            gh release create "$TAG" "dist/${NAME}" --target "$GITHUB_SHA" \
              --title "VEdit ${STAGE} v${VERSION} — Rust engine (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --latest
          fi
          {
            echo "- Unduh APK langsung: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
            echo "- APK terbaru: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Unggah satu APK tanpa pembungkus ZIP; nama artifact mengikuti nama file APK.
      - name: Upload APK artifact (file APK langsung)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.apk.outputs.name }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Print lint report (on failure)
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null | grep -E "Error:|Warning:" | head -60 || true

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
